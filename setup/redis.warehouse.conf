# 창고 노트북 Redis 설정 - setup_laptop.ps1이 저장소 옆 redis\ 폴더로 복사함
# 보드·키캡 Flask 전용 (REDIS_URL=redis://127.0.0.1:6379/0) - 이 PC 안에서만 접속
# 경로는 상대경로: Redis는 redis\ 폴더에서 실행됨 (start_all 탭, 서비스 모두 작업 폴더 = redis\)
bind 127.0.0.1
port 6379
protected-mode yes
dir ./data
logfile "redis.log"
# 큐/게이트/재고가 재시작 후에도 남게 - 1초마다 디스크 기록(AOF) + 주기 스냅샷
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
maxmemory 256mb
